<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #18181a;
    --surface: #232326;
    --surface-2: #2b2b2f;
    --border: #38383d;
    --text: #ececee;
    --muted: #91919a;
    --accent: #ff4d2e;
    --accent-dim: #7a2717;
    --ok: #6bcb77;
    --danger: #ff6b6b;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; padding: 0 0 4rem; }

  a, button, input, select { font-family: inherit; }

  header {
    padding: 2.25rem 1.5rem 1.5rem;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: baseline; gap: 0.75rem; }

  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.9rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0;
  }

  .brand .accent { color: var(--accent); }

  .stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    transform: rotate(-4deg);
    white-space: nowrap;
  }

  .api-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 0;
  }

  /* ---------- screens ---------- */

  .screen { display: none; flex-direction: column; gap: 1.25rem; animation: fadeIn 0.18s ease; }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.25rem 1.5rem;
  }

  h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  h2::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--accent);
    display: inline-block;
    border-radius: 2px;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font-size: 0.82rem;
    cursor: pointer;
  }

  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  form { display: flex; flex-direction: column; gap: 0.7rem; }

  .field { display: flex; flex-direction: column; gap: 0.3rem; }

  label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.65rem;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus, select:focus { border-color: var(--accent); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.7rem; }

  @media (max-width: 480px) {
    .row3 { grid-template-columns: 1fr 1fr; }
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 0.9rem;
    font-weight: 600;
    font-size: 0.85rem;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }

  button:active { transform: scale(0.97); }

  .btn-primary { background: var(--accent); color: #1a1a1a; margin-top: 0.3rem; }
  .btn-primary:hover { opacity: 0.92; }

  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 0.35rem 0.6rem;
    font-size: 0.75rem;
  }
  .btn-danger:hover { background: var(--danger); color: #1a1a1a; }

  .btn-small { padding: 0.35rem 0.6rem; font-size: 0.75rem; }

  .toggle-form-btn {
    background: var(--surface-2);
    border: 1px dashed var(--border);
    color: var(--muted);
    width: 100%;
    padding: 0.7rem;
  }
  .toggle-form-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- home: user list ---------- */

  .user-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .user-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    transition: border-color 0.15s ease;
  }

  .user-card:hover { border-color: var(--accent); }

  .user-card .u-name { font-weight: 600; font-size: 0.94rem; }
  .user-card .u-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .chevron { color: var(--muted); font-size: 1.1rem; }

  .imc-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 1.2rem 0.5rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  /* ---------- detail screen: user info card ---------- */

  .user-info-card {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem 1.2rem;
  }

  .stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .stat-value.imc-normal { color: var(--ok); }
  .stat-value.imc-alerta { color: var(--accent); }

  .user-name-header {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    text-transform: uppercase;
    margin: 0 0 0.9rem;
  }

  /* ---------- exercise entries ---------- */

  .exercicio-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.5rem;
  }

  .day-stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    border: 1.5px solid var(--accent-dim);
    border-radius: 6px;
    padding: 0.25rem 0.4rem;
    min-width: 3.4rem;
    text-align: center;
    flex-shrink: 0;
  }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-weight: 600; font-size: 0.9rem; }
  .ex-series {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .ex-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--ok);
    color: var(--text);
    padding: 0.7rem 1.1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }

  .toast.error { border-left-color: var(--danger); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>App <span class="accent">Treino</span></h1>
    <span class="stamp">Segunda &rarr; Domingo</span>
  </div>
  <div class="api-status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">verificando API...</span>
  </div>
</header>

<main>

  <!-- ===================== TELA 1: HOME ===================== -->
  <div class="screen active" id="screenHome">

    <section>
      <button type="button" class="toggle-form-btn" id="btnToggleForm">+ Cadastrar novo usuário</button>
      <form id="formUsuario" style="display:none; margin-top: 1rem;">
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" required>
        </div>
        <div class="field">
          <label for="sobrenome">Sobrenome</label>
          <input id="sobrenome" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="idade">Idade</label>
            <input id="idade" type="number" min="1" required>
          </div>
          <div class="field">
            <label for="peso">Peso (kg)</label>
            <input id="peso" type="number" step="0.1" min="1" required>
          </div>
        </div>
        <div class="field">
          <label for="altura">Altura (m)</label>
          <input id="altura" type="number" step="0.01" min="0.5" max="2.9" required>
        </div>
        <button type="submit" class="btn-primary">Cadastrar usuário</button>
      </form>
    </section>

    <section>
      <h2>Usuários cadastrados</h2>
      <div class="user-list" id="userList">
        <div class="empty">Carregando usuários...</div>
      </div>
    </section>

  </div>

  <!-- ===================== TELA 2: DETALHES DO USUÁRIO ===================== -->
  <div class="screen" id="screenDetail">

    <div class="top-row">
      <button type="button" class="back-btn" id="btnVoltar">&larr; Voltar</button>
      <button type="button" class="btn-danger" id="btnExcluirUsuario">Excluir usuário</button>
    </div>

    <section>
      <div class="user-name-header" id="detailNome">—</div>
      <div class="user-info-card">
        <div class="stat">
          <span class="stat-label">Idade</span>
          <span class="stat-value" id="detailIdade">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Peso</span>
          <span class="stat-value" id="detailPeso">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Altura</span>
          <span class="stat-value" id="detailAltura">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">IMC</span>
          <span class="stat-value" id="detailImc">—</span>
        </div>
      </div>
    </section>

    <section>
      <button type="button" class="toggle-form-btn" id="btnToggleFormExercicio">+ Adicionar exercício</button>
      <form id="formExercicio" style="display:none; margin-top: 1rem;">
        <div class="field">
          <label for="nomeExercicio">Nome do exercício</label>
          <input id="nomeExercicio" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="series">Séries</label>
            <input id="series" type="number" min="1" required>
          </div>
          <div class="field">
            <label for="repeticoes">Repetições</label>
            <input id="repeticoes" type="number" min="1" required>
          </div>
        </div>
        <div class="field">
          <label for="dia">Dia da semana</label>
          <select id="dia" required>
            <option value="">Selecione</option>
            <option>Segunda</option>
            <option>Terça</option>
            <option>Quarta</option>
            <option>Quinta</option>
            <option>Sexta</option>
            <option>Sábado</option>
            <option>Domingo</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Adicionar exercício</button>
      </form>
    </section>

    <section>
      <h2>Exercícios cadastrados</h2>
      <div id="exercicioList">
        <div class="empty">Nenhum exercício ainda.</div>
      </div>
    </section>

  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const API = 'http://127.0.0.1:5000';

let usuarios = [];
let usuarioSelecionadoId = null;

const screenHome = document.getElementById('screenHome');
const screenDetail = document.getElementById('screenDetail');
const userList = document.getElementById('userList');
const exercicioList = document.getElementById('exercicioList');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const toast = document.getElementById('toast');

const btnToggleForm = document.getElementById('btnToggleForm');
const formUsuario = document.getElementById('formUsuario');
const btnToggleFormExercicio = document.getElementById('btnToggleFormExercicio');
const formExercicio = document.getElementById('formExercicio');
const btnVoltar = document.getElementById('btnVoltar');
const btnExcluirUsuario = document.getElementById('btnExcluirUsuario');

const detailNome = document.getElementById('detailNome');
const detailIdade = document.getElementById('detailIdade');
const detailPeso = document.getElementById('detailPeso');
const detailAltura = document.getElementById('detailAltura');
const detailImc = document.getElementById('detailImc');

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { toast.className = 'toast'; }, 2600);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function apiCall(path, options) {
  try {
    const res = await fetch(API + path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.erro || 'Erro na requisição (' + res.status + ')');
    }
    return data;
  } catch (err) {
    if (err.message.includes('fetch')) {
      throw new Error('Não foi possível conectar na API. Ela está rodando em ' + API + ' ?');
    }
    throw err;
  }
}

async function checarApi() {
  try {
    await apiCall('/usuarios');
    statusDot.className = 'dot on';
    statusText.textContent = 'API conectada';
    return true;
  } catch (err) {
    statusDot.className = 'dot off';
    statusText.textContent = 'API offline';
    return false;
  }
}

// ---------- navegação entre telas ----------

function irParaHome() {
  usuarioSelecionadoId = null;
  screenDetail.classList.remove('active');
  screenHome.classList.add('active');
  carregarUsuarios();
}

async function irParaDetalhe(userId) {
  usuarioSelecionadoId = userId;
  screenHome.classList.remove('active');
  screenDetail.classList.add('active');
  formExercicio.style.display = 'none';
  btnToggleFormExercicio.textContent = '+ Adicionar exercício';
  await carregarDetalheUsuario();
  await carregarExercicios();
}

btnVoltar.addEventListener('click', irParaHome);

// ---------- toggles dos formulários ----------

btnToggleForm.addEventListener('click', () => {
  const aberto = formUsuario.style.display !== 'none';
  formUsuario.style.display = aberto ? 'none' : 'flex';
  btnToggleForm.textContent = aberto ? '+ Cadastrar novo usuário' : '– Fechar formulário';
});

btnToggleFormExercicio.addEventListener('click', () => {
  const aberto = formExercicio.style.display !== 'none';
  formExercicio.style.display = aberto ? 'none' : 'flex';
  btnToggleFormExercicio.textContent = aberto ? '+ Adicionar exercício' : '– Fechar formulário';
});

// ---------- HOME: lista de usuários ----------

function renderUsuarios() {
  if (usuarios.length === 0) {
    userList.innerHTML = '<div class="empty">Nenhum usuário cadastrado ainda.</div>';
    return;
  }
  userList.innerHTML = '';
  usuarios.forEach(u => {
    const card = document.createElement('div');
    card.className = 'user-card';
    card.innerHTML = `
      <div>
        <div class="u-name">${escapeHtml(u.nome)} ${escapeHtml(u.sobrenome)}</div>
        <div class="u-meta">${u.idade}a · ${u.peso}kg · ${u.altura}m</div>
      </div>
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <span class="imc-badge">IMC ${u.imc}</span>
        <span class="chevron">›</span>
      </div>
    `;
    card.addEventListener('click', () => irParaDetalhe(u.id));
    userList.appendChild(card);
  });
}

async function carregarUsuarios() {
  try {
    usuarios = await apiCall('/usuarios');
    renderUsuarios();
  } catch (err) {
    userList.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById('formUsuario').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    nome: document.getElementById('nome').value.trim(),
    sobrenome: document.getElementById('sobrenome').value.trim(),
    idade: Number(document.getElementById('idade').value),
    peso: Number(document.getElementById('peso').value),
    altura: Number(document.getElementById('altura').value),
  };
  try {
    await apiCall('/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showToast('Usuário cadastrado com sucesso!');
    e.target.reset();
    formUsuario.style.display = 'none';
    btnToggleForm.textContent = '+ Cadastrar novo usuário';
    await carregarUsuarios();
  } catch (err) {
    showToast(err.message, true);
  }
});

// ---------- TELA DE DETALHES: dados do usuário ----------

function classificacaoClasse(classificacao) {
  return classificacao === 'Peso normal' ? 'imc-normal' : 'imc-alerta';
}

async function carregarDetalheUsuario() {
  try {
    const u = await apiCall('/usuarios/' + usuarioSelecionadoId);
    detailNome.textContent = `${u.nome} ${u.sobrenome}`;
    detailIdade.textContent = `${u.idade} anos`;
    detailPeso.textContent = `${u.peso} kg`;
    detailAltura.textContent = `${u.altura} m`;
    detailImc.textContent = `${u.imc} · ${u.classificacao_imc}`;
    detailImc.className = 'stat-value ' + classificacaoClasse(u.classificacao_imc);
  } catch (err) {
    showToast(err.message, true);
    irParaHome();
  }
}

btnExcluirUsuario.addEventListener('click', async () => {
  if (!usuarioSelecionadoId) return;
  if (!confirm('Excluir esse usuário e todos os exercícios dele?')) return;
  try {
    await apiCall('/usuarios/' + usuarioSelecionadoId, { method: 'DELETE' });
    showToast('Usuário excluído.');
    irParaHome();
  } catch (err) {
    showToast(err.message, true);
  }
});

// ---------- TELA DE DETALHES: exercícios do usuário ----------

async function carregarExercicios() {
  try {
    const exercicios = await apiCall('/usuarios/' + usuarioSelecionadoId + '/exercicios');
    renderExercicios(exercicios);
  } catch (err) {
    exercicioList.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

function renderExercicios(exercicios) {
  if (exercicios.length === 0) {
    exercicioList.innerHTML = '<div class="empty">Esse usuário ainda não tem exercícios.</div>';
    return;
  }
  exercicioList.innerHTML = '';
  exercicios.forEach(ex => {
    const row = document.createElement('div');
    row.className = 'exercicio-row';
    row.innerHTML = `
      <div class="day-stamp">${escapeHtml(ex.dia || '—')}</div>
      <div class="ex-info">
        <div class="ex-name">${escapeHtml(ex.nome_exercicio)}</div>
        <div class="ex-series">${ex.series} séries · ${ex.repeticoes} rep</div>
      </div>
      <div class="ex-actions">
        <button class="btn-ghost btn-small" data-edit="${ex.id}">Editar</button>
        <button class="btn-danger" data-del-ex="${ex.id}">Excluir</button>
      </div>
    `;
    exercicioList.appendChild(row);
  });

  exercicioList.querySelectorAll('[data-del-ex]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.delEx);
      if (!confirm('Excluir esse exercício?')) return;
      try {
        await apiCall('/exercicios/' + id, { method: 'DELETE' });
        showToast('Exercício excluído.');
        await carregarExercicios();
      } catch (err) {
        showToast(err.message, true);
      }
    });
  });

  exercicioList.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.edit);
      const novoNome = prompt('Novo nome do exercício (deixe em branco para não mudar):', '');
      const novaSeries = prompt('Novo número de séries (deixe em branco para não mudar):', '');
      const novasRepeticoes = prompt('Novo número de repetições (deixe em branco para não mudar):', '');
      const novoDia = prompt('Novo dia (Segunda, Terça, Quarta, Quinta, Sexta, Sábado, Domingo — em branco para não mudar):', '');

      const payload = {};
      if (novoNome && novoNome.trim()) payload.nome_exercicio = novoNome.trim();
      if (novaSeries && novaSeries.trim()) payload.series = Number(novaSeries);
      if (novasRepeticoes && novasRepeticoes.trim()) payload.repeticoes = Number(novasRepeticoes);
      if (novoDia && novoDia.trim()) payload.dia = novoDia.trim();

      if (Object.keys(payload).length === 0) return;

      try {
        await apiCall('/exercicios/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast('Exercício atualizado.');
        await carregarExercicios();
      } catch (err) {
        showToast(err.message, true);
      }
    });
  });
}

document.getElementById('formExercicio').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!usuarioSelecionadoId) return;
  const payload = {
    nome_exercicio: document.getElementById('nomeExercicio').value.trim(),
    series: Number(document.getElementById('series').value),
    repeticoes: Number(document.getElementById('repeticoes').value),
    dia: document.getElementById('dia').value,
  };
  try {
    await apiCall('/usuarios/' + usuarioSelecionadoId + '/exercicios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showToast('Exercício adicionado com sucesso!');
    e.target.reset();
    formExercicio.style.display = 'none';
    btnToggleFormExercicio.textContent = '+ Adicionar exercício';
    await carregarExercicios();
  } catch (err) {
    showToast(err.message, true);
  }
});

// ---------- inicialização ----------

(async function init() {
  const ok = await checarApi();
  if (ok) await carregarUsuarios();
})();
</script>
